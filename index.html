/* ---------- DeepSeek ---------- */
function extractJson(text) {
  if (!text) return null;
  let t = String(text).trim();
  t = t.replace(/^```(?:json)?/i, '').trim();
  t = t.replace(/```$/, '').trim();
  try { return JSON.parse(t); } catch (e) {}
  const s = t.indexOf('{'), e = t.lastIndexOf('}');
  if (s !== -1 && e !== -1 && e > s) {
    try { return JSON.parse(t.slice(s, e + 1)); } catch (e2) {}
  }
  return null;
}

const REQUIRED_KEYS = ['summary', 'visual_risk', 'adhd_risk', 'possible_reason', 'recommended_path', 'family_advice', 'safety_warning'];

async function callDeepSeek(payload, key) {
  const resp = await fetch(API_BASE + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify({
      model: MODEL,
      messages: [
        { role: 'system', content: SYSTEM_PROMPT },
        { role: 'user', content: buildUserPrompt(payload) },
      ],
      temperature: 0.3,
      max_tokens: 2000,
      response_format: { type: 'json_object' },
      stream: false,
    }),
  });
  if (!resp.ok) {
    const txt = await resp.text().catch(() => '');
    throw new Error('DeepSeek HTTP ' + resp.status + ': ' + txt.slice(0, 200));
  }
  const data = await resp.json();
  const content = data.choices[0].message.content;
  const parsed = extractJson(content);
  if (!parsed) throw new Error('DeepSeek 返回内容无法解析为 JSON');
  for (const k of REQUIRED_KEYS) if (parsed[k] === undefined) parsed[k] = '';
  return parsed;
}

/* ---------- 本地规则引擎 ---------- */
const NEG_WORDS = ['无明显', '并无', '没有', '未发现', '未见', '否认', '不伴', '无', '未'];
const NEG_WINDOW = 8;

function isNegated(text, idx) {
  const win = text.slice(Math.max(0, idx - NEG_WINDOW), idx);
  return NEG_WORDS.some(n => win.includes(n));
}

function matchScore(text, item) {
  let score = 0;
  const hits = [];
  function hit(word, weight) {
    let start = 0, counted = false;
    while (true) {
      const idx = text.indexOf(word, start);
      if (idx === -1) break;
      if (!isNegated(text, idx)) {
        if (!counted) { score += weight; hits.push(word); counted = true; }
      }
      start = idx + word.length;
    }
  }
  for (const alias of (item.aliases || [])) {
    if (alias && text.includes(alias)) hit(alias, 3);
  }
  for (const sign of (item.signs || [])) {
    for (const seg of String(sign).split(/[，,、（）()/\s]+/)) {
      if (seg.length >= 3 && text.includes(seg)) hit(seg, 2);
    }
  }
  const name = item.name || '';
  if (name && text.includes(name)) hit(name, 4);
  return { score, hits: [...new Set(hits)] };
}

function levelFromScore(score) {
  if (score >= 10) return '较高';
  if (score >= 6) return '中等';
  if (score >= 3) return '偏低';
  return '低';
}

/* ---------- 安全引擎 ---------- */
const LEVEL_ORDER = ['routine', 'soon', 'emergency'];
function maxLevel(a, b) {
  const ia = LEVEL_ORDER.indexOf(a) >= 0 ? LEVEL_ORDER.indexOf(a) : 0;
  const ib = LEVEL_ORDER.indexOf(b) >= 0 ? LEVEL_ORDER.indexOf(b) : 0;
  return LEVEL_ORDER[Math.max(ia, ib)];
}
function scanForbidden(...texts) {
  const joined = texts.filter(Boolean).join('\n');
  const hits = (RULES.forbidden_phrases || []).filter(p => joined.includes(p));
  return { triggered: hits.length > 0, hits, append_warning: RULES.append_warning };
}
function scanRedFlags(...texts) {
  const joined = texts.filter(Boolean).join('\n');
  const matched = [];
  for (const item of (RULES.red_flags || [])) {
    for (const kw of (item.keyword || [])) {
      if (joined.includes(kw)) { matched.push({ id: item.id, keyword: kw, advice: item.advice }); break; }
    }
  }
  return { triggered: matched.length > 0, matched };
}
function evaluate(parentInput, aiTexts) {
  aiTexts = aiTexts || [];
  const forbidden = scanForbidden(parentInput, ...aiTexts);
  const red = scanRedFlags(parentInput, ...aiTexts);
  let level = 'routine';
  if (forbidden.triggered) level = maxLevel(level, 'soon');
  if (red.triggered) level = 'emergency';
  const parts = [];
  if (red.triggered) for (const m of red.matched) parts.push('【需要立即处理】' + m.advice);
  if (forbidden.triggered) parts.push('【安全规则触发】检测到可能被误解为『自行调整药物或替代正规治疗』的表述（' + forbidden.hits.join('、') + '）。' + (RULES.append_warning || ''));
  if (!parts.length) parts.push('本报告为健康教育与就医导航参考，不构成诊断或处方建议。如对孩子情况有疑虑，请携带本报告到正规医疗机构面诊确认。');
  parts.push(RULES.closing_statement || '');
  return { level, forbidden, red_flags: red, safety_warning: parts.join('\n'), principles: RULES.principles || [] };
}
function enforce(analysis, parentInput) {
  const aiTexts = Object.keys(analysis)
    .filter(k => k !== 'safety_warning')
    .map(k => analysis[k])
    .filter(v => typeof v === 'string' || typeof v === 'number');
  const result = evaluate(parentInput, aiTexts);
  analysis = Object.assign({}, analysis);
  analysis.safety_warning = result.safety_warning;
  analysis.safety_level = result.level;
  return { analysis, safety: result };
}

/* ---------- 统一入口 ---------- */
async function analyze(payload) {
  if (hasValidKey()) {
    try {
      const parsed = await callDeepSeek(payload, getKey());
      const base = localAnalyze(payload);
      parsed.engine = 'deepseek';
      parsed.model = MODEL;
      parsed.risk_scores = base.risk_scores;
      parsed.factors = base.factors;
      return parsed;
    } catch (e) {
      const fallback = localAnalyze(payload);
      fallback.engine = 'local-fallback';
      fallback.model = 'knowledge-base-rule-engine';
      fallback.fallback_reason = String(e.message || e).slice(0, 300);
      return fallback;
    }
  }
  const fallback = localAnalyze(payload);
  fallback.engine = 'local';
  fallback.model = 'knowledge-base-rule-engine';
  fallback.fallback_reason = '未配置 DEEPSEEK_API_KEY，使用本地知识库规则引擎生成结果。';
  return fallback;
}
